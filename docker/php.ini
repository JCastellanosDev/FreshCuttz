; Ajustes de PHP para Fresh Cuttz en Vercel (se cargan después de php.ini-production).
date.timezone = America/Mexico_City
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Fotos de productos: hasta 3 MB (Vercel acepta cuerpos de hasta 4.5 MB).
upload_max_filesize = 4M
post_max_size = 4M

; Sesiones en MySQL (includes/sesion.php); la limpieza la hace el manejador.
session.gc_probability = 1
session.gc_divisor = 100
