<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbería</title>

  <style>
    body {
      margin: 0;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #efeeee;
    }

    .barber-pole {
      width: 70px;
      height: 280px;

      border: 3px solid #000000;
      border-radius: 35px;

      overflow: hidden;

      /* Efecto de profundidad */
      box-shadow:
        0 10px 25px rgba(0,0,0,.5),
        inset 8px 0 10px rgba(255,255,255,.15),
        inset -8px 0 10px rgba(0,0,0,.3);

      background:
        repeating-linear-gradient(
          -45deg,
          #ffffff 0px,
          #ffffff 25px,

          #d62d2d 25px,
          #d62f29 50px,

          #ffffff 50px,
          #ffffff 75px,

          #1e49ae 75px,
          #0a1bb6 100px
        );

      background-size: 140px 140px;

      animation: girarPoste 2s linear infinite;
    }

    @keyframes girarPoste {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 140px;
      }
    }
  </style>
</head>

<body>

  <div class="barber-pole"></div>

</body>
</html>
