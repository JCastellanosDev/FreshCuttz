<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/contacto.css">
</head>
<body class="pagina-contacto">
    <header>
        <div class="logo"> 
            <a href="index.html" aria-label="Fresh Cuttz, inicio"><img src="./image/logo1.png" alt="Fresh Cuttz"></a>
        </div>
        <nav class="accesos" aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Servicios</a>
        <a href="contacto.html" aria-current="page">Contactanos</a>
        </nav>
        
    </header>
   <main class="seccion-contacto">
    <div class="tarjetas-info">
        <div class="tarjeta-mini">
            <h3>Dirección</h3>
            <a href="https://maps.app.goo.gl/LEtbziQ2he6aUzBK7"target="_blank" rel="noopener noreferrer">
            Av. Industrias, Chihuahua, Chih., 31136
            </a>
            
        </div>
        <div class="tarjeta-mini">
            <h3> WhatsApp</h3>
            <a href="tel:+526143633515">+52 614 363 3515</a>
        </div>
        <div class="tarjeta-mini">
            <h3> Horarios</h3>
            <p>Lun - Sáb: 10:00 AM - 8:00 PM</p>
        </div>
    </div>

    
    <div class="tarjeta-dividida">
        
        <div class="contacto-formulario">
            <h2>Agenda tu corte</h2>
            <form action="#">
                <input type="text" aria-label="Tu nombre" placeholder="Tu Nombre" required>
                <input type="tel" aria-label="Tu celular" placeholder="Tu Celular" required>
                <select aria-label="Servicio" required>
                    <option value="" disabled selected>Elige tu servicio...</option>
                    <option value="fade">Corte Fade Navaja</option>
                    <option value="clasico">Clásico Tradicional</option>
                    <option value="barba">Diseño de Barba</option>
                </select>
                <button type="submit">Enviar Mensaje</button>
            </form>
        </div>
        
        
        <div class="contacto-mapa">
          
            <iframe title="Ubicación de Fresh Cuttz Barbershop" src="https://maps.google.com/maps?q=28.726003,-106.111288&amp;z=16&amp;output=embed" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

    </div>
</main>
    <footer><span>Fresh Cuttz Barbershop <span class="footer-frase">#ISTAYFRESH</span></span></footer>
</body>
</html>
